name: Tests
on:
  push:
  pull_request:
jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install 'pydantic>=2.8.0' 'pytest>=8.0.0'
      - run: python -m pytest -q
